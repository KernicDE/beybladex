# .github/workflows/deploy.yml (Phase 6)
# Builds the Docker image and pushes it to GHCR on merge to main; Watchtower on
# the deploy server (nicolas@kernic.net) pulls ghcr.io/kernicde/beybladex:latest
# automatically. Migrations run inside the container at every start (Dockerfile
# CMD), so this workflow only needs to produce a working image.
#
# GATE — why `workflow_run` and not `needs:`:
# `needs:` only orders jobs WITHIN one workflow file, so it cannot express
# "deploy.yml runs after ci.yml succeeds". Both files trigger independently on
# `push: branches: [main]` by default, which would let deploy build/push an
# image for a commit whose tests are red. Instead, this workflow triggers on
# the `workflow_run` completion of the "CI" workflow and no-ops unless that run
# concluded successfully. The extra guards (head_branch == 'main' and event ==
# 'push') prevent PR-triggered CI runs from producing a deploy, and the
# checkout pins the exact commit the green CI run tested, so the image always
# matches verified code.
name: Build and Push

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  build-and-push:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Lowercase repository owner (GHCR requires lowercase image names)
        run: echo "IMAGE_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/beybladex:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
