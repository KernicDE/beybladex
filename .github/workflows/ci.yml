# .github/workflows/ci.yml
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beybladex
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: beybladex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U beybladex -d beybladex_test"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://beybladex:ci_test_password@localhost:5432/beybladex_test
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-test-secret-not-for-production
      TOTP_ENCRYPTION_KEY: dGVzdC1rZXktMzItYnl0ZXMtcGFkZGVkLTEyMzQ1Njc4OQ==
      WEBAUTHN_RP_ID: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # .next/types (route typegen) is gitignored and only exists after a build/dev run;
      # generate it explicitly so `tsc --noEmit` passes on a fresh checkout.
      - run: npx next typegen
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm run test:all

  # The ONLY place `docker build` ever runs for this project (Global Constraints:
  # no local Docker on dev machines). Builds the production image and boots it
  # against this job's own fresh Postgres/Redis service containers, proving the
  # migrate-then-serve entrypoint works end to end.
  docker-boot-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beybladex
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: beybladex_boot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U beybladex -d beybladex_boot"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      # Reachable from the RUNNER (curl, this job's own env) — the loopback the
      # GitHub service containers actually publish to.
      DATABASE_URL: postgresql://beybladex:ci_test_password@localhost:5432/beybladex_boot
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-test-secret-not-for-production
      TOTP_ENCRYPTION_KEY: dGVzdC1rZXktMzItYnl0ZXMtcGFkZGVkLTEyMzQ1Njc4OQ==
      WEBAUTHN_RP_ID: localhost
      # Reachable from INSIDE the app container (bridge network, see note below)
      # — same services, addressed via the Docker-provided host gateway alias.
      CONTAINER_DATABASE_URL: postgresql://beybladex:ci_test_password@host.docker.internal:5432/beybladex_boot
      CONTAINER_REDIS_URL: redis://host.docker.internal:6379
    steps:
      - uses: actions/checkout@v4
      # NETWORKING NOTE, revised after the first real run: `--network host` DID
      # let the container reach Postgres/Redis outbound (11 migrations applied
      # successfully, twice), but `curl` on the runner could NEVER reach the
      # app's inbound port 3000 through it — for the FULL retry budget, both
      # attempts, with the server's own logs showing it had reached "Ready" long
      # before the timeout. Whatever the exact cause (this runner image's
      # network/iptables setup not treating `--network host` containers
      # identically to bare processes), it isn't the officially documented,
      # broadly-portable pattern — so switched to normal bridge networking:
      # `-p 3000:3000` publishes the container's port to the runner's actual
      # localhost (what curl below already expects), and
      # `--add-host host.docker.internal:host-gateway` gives the CONTAINER a
      # route back to the runner's own services for DATABASE_URL/REDIS_URL —
      # the standard technique for a Docker container reaching host-published
      # ports on GitHub Actions Linux runners (Docker 20.10+).
      - name: Build image
        run: docker build -t beybladex:ci .
      - name: Boot container (runs `prisma migrate deploy` before serving)
        run: >-
          docker run -d --name beybladex-ci -p 3000:3000
          --add-host=host.docker.internal:host-gateway
          -e DATABASE_URL="$CONTAINER_DATABASE_URL" -e REDIS_URL="$CONTAINER_REDIS_URL"
          -e NEXTAUTH_URL -e NEXTAUTH_SECRET -e TOTP_ENCRYPTION_KEY -e WEBAUTHN_RP_ID
          beybladex:ci
      # The CMD fails fast (container exits) if `prisma migrate deploy` errors,
      # so a 200 here proves migrate-then-serve succeeded. Retry loop with a
      # generous timeout: a cold `npx prisma migrate deploy` (no cached engine,
      # no warm OS page cache) plus `node server.js` startup is a one-time cost
      # this budget must absorb even though the actual boot has repeatedly
      # shown "Ready" within seconds — 60 attempts @ 3s = 180s is ample once
      # the networking itself is reachable at all.
      - name: Wait for /api/health (migrate deploy + server boot)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then
              echo "health check passed"
              exit 0
            fi
            if ! docker ps --format '{{.Names}}' | grep -q '^beybladex-ci$'; then
              echo "container exited during boot; logs:"
              docker logs beybladex-ci
              exit 1
            fi
            sleep 3
          done
          echo "health check timed out after 180s; logs:"
          docker logs beybladex-ci
          exit 1
      - name: Verify no pending migrations in the booted container
        run: docker exec beybladex-ci npx prisma migrate status

  # E2E (Playwright) against the real dev server backed by real Postgres/Redis.
  # Chromium only — keeping the browser install scoped to what the specs need
  # keeps CI fast; widen here if a spec ever requires another engine.
  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: beybladex
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: beybladex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U beybladex -d beybladex_test"
          --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://beybladex:ci_test_password@localhost:5432/beybladex_test
      REDIS_URL: redis://localhost:6379
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-test-secret-not-for-production
      TOTP_ENCRYPTION_KEY: dGVzdC1rZXktMzItYnl0ZXMtcGFkZGVkLTEyMzQ1Njc4OQ==
      WEBAUTHN_RP_ID: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
      - run: npm run test:e2e
      # The offline/airplane-mode acceptance spec needs the PRODUCTION server: Next 16 dev mode
      # gates hydration on the HMR WebSocket, which context.setOffline(true) blocks forever, so a
      # dev-server page reloaded offline never hydrates (framework limitation, proven from the
      # playwright-report trace of the 2026-09-09 run). Production hydration has no WebSocket
      # dependency. The build runs here (prebuild injects the SW build id; postbuild restores).
      - run: npm run test:e2e:offline
      # CI text logs alone can't show what a failing page actually rendered — upload the
      # trace/screenshot (playwright.config.ts's trace: 'on-first-retry' / screenshot:
      # 'only-on-failure') so a failure is debuggable without reproducing it blind.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
