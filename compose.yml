# compose.yml (Phase 6) — deploy-server stack: Next.js app + Postgres + Redis
# behind Traefik, with the Watchtower auto-deploy label.
#
# Traefik network/label shape cross-checked against the server's actual existing
# stack (/opt/docker/dlivr-it/flarum-dlivr-it/compose.yml on nicolas@kernic.net):
# Traefik listens on the external network named `proxy` (not a per-app network),
# certresolver `letsencrypt`, and every router needs an explicit
# `traefik.docker.network=proxy` label since this service also joins the
# app-internal network — without it Traefik can't tell which network to route
# through. The www-redirect and http->https-redirect middleware pattern below
# is copied verbatim from that same working config.
#
# Every secret-bearing value is ${VAR} interpolation backed by a server-side
# .env next to this file (NEVER committed — see .env.example for the key list).
# This is the one permitted deviation from spec §4's literal form per the
# Global Constraints amendment.
#
# Local development does NOT use this file (standing no-local-Docker policy) —
# it exists only for the deploy server.

services:
  app:
    image: ghcr.io/kernicde/beybladex:latest
    container_name: beybladex_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Docker auto-injects HOSTNAME=<container-id> for every container. Next's standalone
      # server.js reads process.env.HOSTNAME as its BIND address (not just a display string) —
      # left at Docker's default, the server binds to the container's internal bridge IP
      # instead of every interface, so `localhost`/127.0.0.1 (what the healthcheck below uses)
      # can never reach it. Found on the actual first deploy: db/redis came up healthy, but
      # `docker exec beybladex_app wget localhost:3000/...` got connection refused despite the
      # app's own logs showing "Ready". Explicitly overriding HOSTNAME here is the documented
      # fix for this well-known Next.js-standalone-in-Docker gotcha.
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://beybladex_user:${DB_PASSWORD}@db:5432/beybladex_db
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: https://beybladex.de
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      INTERNAL_CRON_SECRET: ${INTERNAL_CRON_SECRET}
      # Phase 18 — Web Push (lib/webPush.ts). NEXT_PUBLIC_VAPID_PUBLIC_KEY must be a BUILD-time
      # value (Next.js inlines NEXT_PUBLIC_* vars into the client bundle at build, not read at
      # container start) — this runtime injection only affects the server-side private key/
      # subject; the public key is baked into the image at build time via the same ${...} var.
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      # MediaAsset files (Phase 11's generic upload pipeline) live on the bind-mounted volume
      # below — the container FS is ephemeral (Watchtower recreates on every deploy).
      MEDIA_UPLOADS_DIR: /app/media_uploads
    volumes:
      - media_uploads:/app/media_uploads
    networks:
      - proxy
      - internal
    # Pure liveness probe (app/api/health) — so Traefik/Watchtower never route
    # to a half-booted container mid-deploy. The CMD already runs
    # `prisma migrate deploy` before serving; this confirms the server is up.
    #
    # NOTE: `test:` as a plain string is equivalent to CMD-SHELL <string> per the
    # Compose spec — a literal "CMD " prefix here (fixed post-first-deploy, found
    # when the db healthcheck below failed identically) makes the shell try to
    # run a nonexistent command literally named "CMD". Never prefix a string-form
    # test with "CMD " — that prefix only means something in the ["CMD", ...]
    # array (CMD-EXEC) form, which doesn't support shell operators like `||`.
    healthcheck:
      # 127.0.0.1, not "localhost": found on the real deploy that wget resolved "localhost" to
      # the ::1 (IPv6) /etc/hosts entry first, which HOSTNAME=0.0.0.0 (IPv4-only bind) never
      # answers on — a working server still failed this healthcheck. 127.0.0.1 confirmed working
      # via `docker exec beybladex_app wget -qO- http://127.0.0.1:3000/api/health`.
      test: wget -qO- http://127.0.0.1:3000/api/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.beybladex.rule=Host(`beybladex.de`) || Host(`www.beybladex.de`)
      - traefik.http.routers.beybladex.entrypoints=websecure
      - traefik.http.routers.beybladex.tls.certresolver=letsencrypt
      - traefik.http.routers.beybladex.service=beybladex
      - traefik.http.services.beybladex.loadbalancer.server.port=3000
      # www -> apex redirect (permanent), matching the dlivr-it pattern.
      - traefik.http.routers.beybladex-www-redirect.rule=Host(`www.beybladex.de`)
      - traefik.http.routers.beybladex-www-redirect.entrypoints=web
      - traefik.http.routers.beybladex-www-redirect.middlewares=beybladex-redirect
      - traefik.http.middlewares.beybladex-redirect.redirectregex.regex=^https?://www\.(.*)
      - traefik.http.middlewares.beybladex-redirect.redirectregex.replacement=https://$${1}
      - traefik.http.middlewares.beybladex-redirect.redirectregex.permanent=true
      # HTTP -> HTTPS redirect.
      - traefik.http.routers.beybladex-http.rule=Host(`beybladex.de`) || Host(`www.beybladex.de`)
      - traefik.http.routers.beybladex-http.entrypoints=web
      - traefik.http.routers.beybladex-http.middlewares=beybladex-https
      - traefik.http.middlewares.beybladex-https.redirectscheme.scheme=https
      # Watchtower (running in its own compose stack outside this repo) picks
      # up new :latest images on merge to main and recreates this container.
      - com.centurylinklabs.watchtower.enable=true

  db:
    image: postgres:16-alpine
    container_name: beybladex_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: beybladex_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: beybladex_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: pg_isready -U beybladex_user -d beybladex_db
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: beybladex_redis
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  # One mount for EVERY upload type (part/set images, event headers), not one per feature —
  # lib/media.ts writes "<asset-id>.webp" files here; /api/media/[id] serves them.
  media_uploads:

networks:
  # Traefik's own network on this server — external, not created by this
  # compose file (matches dlivr-it's working config).
  proxy:
    external: true
  # App <-> db/redis only; never exposed to Traefik.
  internal:
    name: beybladex_internal
